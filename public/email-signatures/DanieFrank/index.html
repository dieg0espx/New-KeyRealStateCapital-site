<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Frank - Email Signature</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
        
        .signature {
            display: flex;
            align-items: center;
            max-width: 500px;
            background-color: #ffffff;
            padding: 20px;
            border: none;
        }
        
        .headshot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #0d7871;
            margin-right: 20px;
            flex-shrink: 0;
        }
        
        .content {
            flex: 1;
        }
        
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .logo {
            width: 150px;
            height: 30px;
        }
        
        .company-name {
            font-size: 14px;
            font-weight: bold;
            color: #0d7871;
            margin: 0;
        }
        
        .company-name .capital {
            color: #666666;
            letter-spacing: 1px;
        }
        
        .nmls {
            font-size: 10px;
            color: #999999;
            margin: 2px 0 0 0;
        }
        
        .name {
            font-size: 15px;
            font-weight: 500;
            color: #0d7871;
            margin: 8px 0 0px 0;
        }
        
        .title {
            font-size: 10px;
            color: #666666;
            margin: 0 0 12px 0;
        }
        
        .contact-info {
            font-size: 12px;
            color: #333333;
            line-height: 1;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .contact-icon {
            width: 12px;
            height: 12px;
            margin-right: 8px;
            color: #666666;
            font-size: 12px;
        }
        
        a {
            color: #0d7871;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        hr {
            border: none;
            height: 1px;
            background-color: #e0e0e0;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="signature">
        <img src="headshot.png" alt="Daniel Frank" class="headshot">
        
        <div class="content">
            <div class="logo-section">
                <img src="../logo.png" alt="Key Real Estate Capital Logo" class="logo">
                <div>
                    <p class="nmls">NMLS ID #2676974</p>
                </div>
            </div>
            
            <hr>

            <h2 class="name">Daniel Frank</h2>
            <p class="title">Senior Vice President</p>
            

            <div class="contact-info">
                <div class="contact-item">
                    <i class="bi bi-telephone contact-icon"></i>
                    <span>(619) 649-6933</span>
                </div>
                <div class="contact-item">
                    <i class="bi bi-phone contact-icon"></i>
                    <span>(954) 945-9937</span>
                </div>
                <div class="contact-item">
                    <i class="bi bi-envelope contact-icon"></i>
                    <a href="mailto:daniel@keyrealestatecapital.com">daniel@keyrealestatecapital.com</a>
                </div>
                <div class="contact-item">
                    <i class="bi bi-globe contact-icon"></i>
                    <a href="https://keyrealestatecapital.com" target="_blank">keyrealestatecapital.com</a>
                </div>
                <div class="contact-item">
                    <i class="bi bi-geo-alt contact-icon"></i>
                    <span>401 W A St Ste 200, San Diego, CA 92101</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
